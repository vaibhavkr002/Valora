<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Order Details | VELORA Admin</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("id");
    const target = orderId ? ("order-details.html?id=" + encodeURIComponent(orderId)) : "orders.html?catalog=sarojini";
    window.location.replace(target);
  </script>
</head>
<body style="background:#0b0f19; color:#94a3b8; font-family: sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Redirecting to unified <a href="orders.html?catalog=sarojini" style="color:#e11d48; text-decoration:underline;">Order Details</a>...</p>
</body>
</html>
